name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.19.0'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Display Node.js & npm version
        run: |
          node --version
          npm --version

      - name: Clean install dependencies
        run: npm ci

      - name: Verify package-lock integrity
        run: npm run verify:lock

      - name: Verify macOS fsevents & file watcher (macOS only)
        if: runner.os == 'macOS'
        run: npm run verify:macos-fsevents

      - name: Run TypeScript type check
        run: npm run lint

      - name: Run test suite
        run: npm test

      - name: Run production build
        run: npm run build
