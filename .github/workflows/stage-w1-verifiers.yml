name: Stage W1 verifier regression
on:
  pull_request:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pure-verifiers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.19.0'
      # No product/dependency installation or Windows junction assumptions required.
      - name: Aggregation and fail-closed admission controls
        run: node --test scripts/stage-w1-summary-check.mjs scripts/stage-w1b-summary-check.mjs scripts/stage-w1c-check.mjs scripts/stage-w1d-check.mjs scripts/stage-w1e-check.mjs scripts/stage-w1f-check.mjs scripts/stage-w1g-check.mjs scripts/stage-w1h-entry-check.mjs scripts/stage-w1h-seal-check.mjs
      - name: Prove false PASS mutation is detected
        run: node scripts/stage-w1c-mutation-check.mjs
      - name: Node API lifecycle and cache physical identity controls
        run: node --test scripts/stage-w1f-observer-check.mjs
      - name: Guard currently published W1h logs against raw workspace paths
        run: python3 scripts/stage-w1i-public-log-gate.py .
      - name: Verify synthetic publication guard counterexamples
        run: python3 -m unittest discover -s scripts -p 'stage-w1i-public-log-test.py' -v
      - name: Strict generated-directory and cache controls (portable links)
        run: node scripts/stage-w1d-generated-check.mjs "${{ runner.temp }}/w1d-generated-controls"
